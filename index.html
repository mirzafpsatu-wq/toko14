<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online Shop - Full Catalogue</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --slot-gold: #ffd700; 
      --slot-bg: #0a0a0a; 
      --slot-card-bg: #181818;
      --slot-text: #f5f5f5;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f5af19 100%);
      --dark-card: #222222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--slot-bg); color: var(--slot-text); min-height: 100vh; padding-bottom: 100px; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1f1f1f 0%, #111111 100%);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--slot-gold);
    }
    .top-search-row { display: flex; align-items: center; gap: 12px; }
    .search-box {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid var(--slot-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
    }
    .search-box input { border: none; outline: none; width: 100%; font-size: 13px; color: #fff; background: transparent; }
    
    .header-cart-btn {
      position: relative;
      color: var(--slot-gold);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: transform 0.2s;
    }
    .badge-cart-top {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #ff0000;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* KATEGORI FILTER BAR */
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 2px 0;
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    
    .cat-btn {
      background: #222;
      color: #ccc;
      border: 1px solid #444;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active, .cat-btn:hover {
      background: var(--gold-gradient);
      color: #000;
      font-weight: bold;
      border-color: var(--slot-gold);
    }

    /* GRID PRODUK */
    .container { max-width: 900px; margin: 15px auto; padding: 0 12px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .product-card { 
      background: var(--slot-card-bg); 
      border-radius: 8px; 
      overflow: hidden; 
      border: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--slot-gold);
    }

    .img-wrapper { overflow: hidden; position: relative; cursor: pointer; height: 180px; background: #000; }
    
    .product-img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      display: block;
      transition: transform 0.4s ease;
    }
    .img-wrapper:hover .product-img {
      transform: scale(1.05);
    }

    .discount-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #ff0000;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 5px;
      border-radius: 4px;
      z-index: 2;
    }

    .product-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-title { font-size: 12px; font-weight: 600; color: #fff; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 32px; }
    .product-price { color: var(--slot-gold); font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .product-sold { font-size: 10px; color: #aaa; margin-bottom: 8px; }

    /* TOMBOL AKSI */
    .action-btn-group { display: flex; gap: 6px; width: 100%; }
    .btn-cart { 
      flex: 1; 
      background: var(--gold-gradient); 
      color: #000; 
      border: none; 
      padding: 8px 4px; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .btn-cart:active { transform: scale(0.95); }
    .btn-buy-direct { 
      flex: 1; 
      background: #e50914; 
      color: #fff; 
      border: none; 
      padding: 8px 4px; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 11px; 
      text-align: center;
    }

    .btn-pay-now {
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.1s;
    }
    .btn-pay-now:active { transform: scale(0.95); }

    /* BOTTOM NAV BAR */
    .fixed-bottom-container { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 150; background: #121212; border-top: 1px solid var(--slot-gold); }
    .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 11px; cursor: pointer; width: 33.3%; }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .nav-item.active { color: var(--slot-gold); font-weight: bold; }

    /* MODAL GENERAL */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; overflow-y: auto; }
    .animated-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* MODAL KERANJANG */
    .cart-modal-box {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      margin: 50px auto;
      border: 1px solid var(--slot-gold);
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #333;
    }
    .cart-item-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #444;
      flex-shrink: 0;
    }
    .cart-item-info { flex: 1; overflow: hidden; }
    .cart-item-title { font-size: 11px; color: #fff; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-price { font-size: 12px; color: var(--slot-gold); margin-top: 2px; }
    
    /* KONTROL QUANTITY (+ / -) */
    .cart-qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .qty-btn {
      background: #2a2a2a;
      border: 1px solid var(--slot-gold);
      color: var(--slot-gold);
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      user-select: none;
    }
    .qty-btn:active { background: var(--slot-gold); color: #000; }
    .qty-number { font-size: 12px; color: #fff; font-weight: bold; min-width: 18px; text-align: center; }

    /* PREVIEW MEDIA */
    .image-preview-box {
      max-width: 450px;
      margin: 60px auto;
      background: #181818;
      border: 2px solid var(--slot-gold);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      position: relative;
    }
    .preview-media-full {
      width: 100%;
      border-radius: 6px;
      max-height: 380px;
      object-fit: cover;
    }

    /* PROFIL SAYA */
    .profile-container { background: var(--slot-bg); color: var(--slot-text); min-height: 100vh; width: 100%; max-width: 500px; margin: 0 auto; position: relative; border-left: 1px solid #333; border-right: 1px solid #333; }
    .profile-header { background: linear-gradient(135deg, #1c1a00, #3a3200); padding: 20px 15px; color: var(--slot-gold); border-bottom: 2px solid var(--slot-gold); position: relative; }
    .profile-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .profile-user-info { display: flex; align-items: center; gap: 12px; }
    .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: #111; border: 2px solid var(--slot-gold); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--slot-gold); }
    
    .btn-logout-profile {
      background: #d32f2f;
      color: #fff;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .header-admin-btn {
      background: rgba(0,0,0,0.6);
      color: var(--slot-gold);
      border: 1px solid var(--slot-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .profile-card { background: var(--dark-card); margin: 12px; padding: 14px; border-radius: 8px; border: 1px solid #333; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--slot-gold); border-bottom: 1px solid #333; padding-bottom: 6px; }
    
    .grid-menu { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: 11px; gap: 8px; color: #ccc; }
    .grid-btn { background: none; border: none; color: #ccc; cursor: pointer; padding: 5px; border-radius: 6px; }
    .grid-btn i { font-size: 20px; color: var(--slot-gold); margin-bottom: 5px; display: block; }

    .close-profile-btn { position: absolute; top: 12px; left: 12px; background: none; border: none; color: var(--slot-gold); font-size: 18px; cursor: pointer; }

    /* CHECKOUT MODAL FORM */
    .checkout-box { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; margin: 60px auto; border: 1px solid var(--slot-gold); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    
    .order-item-card { background: #111; border: 1px solid #333; padding: 12px; border-radius: 6px; margin-top: 8px; font-size: 12px; }
    .badge-status { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }

    /* BOX LUNASI PEMBAYARAN */
    .pay-detail-box {
      background: #181818;
      border: 1px solid var(--slot-gold);
      border-radius: 6px;
      padding: 12px;
      margin: 10px 0;
    }
    .bank-acc-info {
      background: #252525;
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
      font-size: 12px;
      color: #fff;
    }

    /* TOGGLE LOGIN/REGISTER */
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; }
    .auth-tab { flex: 1; text-align: center; padding: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: #888; }
    .auth-tab.active { color: var(--slot-gold); border-bottom: 2px solid var(--slot-gold); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-search-row">
      <div class="search-box">
        <i class="fas fa-magnifying-glass" style="color:var(--slot-gold);"></i>
        <input type="text" id="searchInput" oninput="searchProducts()" placeholder="Cari Blok Grend 55, Piston, Ban...">
      </div>
      <div class="header-cart-btn" id="cartHeaderIcon" onclick="openCartModal()">
        <i class="fas fa-cart-shopping"></i>
        <span class="badge-cart-top" id="topCartBadge">0</span>
      </div>
    </div>

    <div class="category-bar">
      <button class="cat-btn active" onclick="filterCategory('semua', this)">Semua</button>
      <button class="cat-btn" onclick="filterCategory('otomotif', this)">Otomotif</button>
      <button class="cat-btn" onclick="filterCategory('fashion', this)">Fashion</button>
      <button class="cat-btn" onclick="filterCategory('elektronik', this)">Elektronik</button>
      <button class="cat-btn" onclick="filterCategory('sepatu', this)">Sepatu</button>
      <button class="cat-btn" onclick="filterCategory('aksesoris', this)">Aksesoris</button>
    </div>
  </header>

  <div class="container">
    <div class="product-grid" id="productGridList"></div>
  </div>

  <!-- FIXED BOTTOM BAR -->
  <div class="fixed-bottom-container">
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab(this); showBeranda();">
        <i class="fas fa-house"></i>
        <span>Beranda</span>
      </div>

      <!-- NAV ITEM TENGAH: LOGIN / STATUS LOGIN DINAMIS -->
      <div class="nav-item" id="middleNavItem" onclick="handleMiddleNavClick()">
        <i class="fas fa-right-to-bracket" id="middleNavIcon"></i>
        <span id="middleNavText">Login</span>
      </div>

      <div class="nav-item" onclick="openProfileModal()">
        <i class="far fa-user"></i>
        <span>Saya</span>
      </div>
    </nav>
  </div>

  <!-- MODAL LOGIN / REGISTER -->
  <div class="modal" id="loginModal">
    <div class="checkout-box animated-pop">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Masuk</div>
        <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Daftar</div>
      </div>

      <!-- FORM LOGIN -->
      <form id="formLogin" onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Username / Email</label>
          <input type="text" id="loginUser" required placeholder="Masukkan username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPass" required placeholder="Masukkan password">
        </div>
        <button type="submit" class="btn-buy-direct" style="width:100%; margin-top: 10px; padding: 10px; background:var(--gold-gradient); color:#000; font-weight:bold;">
          Masuk Sekarang
        </button>
        <button type="button" onclick="closeLoginModal()" style="background: none; border: none; color: #888; width: 100%; margin-top: 8px; font-size: 12px; cursor: pointer;">Tutup</button>
      </form>

      <!-- FORM REGISTER -->
      <form id="formRegister" onsubmit="submitRegister(event)" style="display: none;">
        <div class="form-group">
          <label>Username Baru</label>
          <input type="text" id="regUser" required placeholder="Buat username">
        </div>
        <div class="form-group">
          <label>Nomor WhatsApp</label>
          <input type="tel" id="regPhone" required placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" required placeholder="Buat password">
        </div>
        <button type="submit" class="btn-buy-direct" style="width:100%; margin-top: 10px; padding: 10px; background:var(--gold-gradient); color:#000; font-weight:bold;">
          Daftar Akun
        </button>
        <button type="button" onclick="closeLoginModal()" style="background: none; border: none; color: #888; width: 100%; margin-top: 8px; font-size: 12px; cursor: pointer;">Tutup</button>
      </form>
    </div>
  </div>

  <!-- MODAL KERANJANG -->
  <div class="modal" id="cartModal">
    <div class="cart-modal-box animated-pop">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
        <h3 style="color:var(--slot-gold); font-size:16px;"><i class="fas fa-cart-shopping"></i> Keranjang Belanja Saya</h3>
        <button onclick="closeCartModal()" style="background:none; border:none; color:var(--slot-gold); font-size:20px; cursor:pointer;">&times;</button>
      </div>

      <div id="cartItemsList"></div>

      <div id="cartFooter" style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
        <div style="display:flex; justify-content:space-between; color:#fff; font-size:14px; font-weight:bold; margin-bottom:10px;">
          <span>Total:</span>
          <span id="cartTotalPrice" style="color:var(--slot-gold);">Rp 0</span>
        </div>
        <button class="btn-buy-direct" style="width:100%; padding:10px;" onclick="checkoutFromCart()">Checkout Keranjang</button>
      </div>
    </div>
  </div>

  <!-- MODAL PREVIEW MEDIA -->
  <div class="modal" id="imageModal">
    <div class="image-preview-box animated-pop">
      <button onclick="closeMediaPreview()" style="position:absolute; top:8px; right:12px; background:none; border:none; color:var(--slot-gold); font-size:22px; cursor:pointer; z-index: 10;">&times;</button>
      <h4 id="previewTitle" style="color:var(--slot-gold); font-size:13px; margin-bottom:10px;"></h4>
      <div id="previewMediaContainer"></div>
      <button class="btn-buy-direct" style="width:100%; margin-top:12px; padding:10px;" onclick="closeMediaPreview()">Tutup Preview</button>
    </div>
  </div>

  <!-- MODAL PROFIL SAYA (CUSTOMER PAGE) -->
  <div class="modal" id="profileModal">
    <div class="profile-container animated-pop">
      <div class="profile-header">
        <button class="close-profile-btn" onclick="closeProfileModal()"><i class="fas fa-arrow-left"></i></button>
        <div class="profile-top-bar">
          <a href="admin.html" class="header-admin-btn"><i class="fas fa-user-shield"></i> Admin VIP</a>
          <button class="btn-logout-profile" onclick="processLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="profile-user-info">
          <div class="profile-avatar"><i class="fas fa-user-ninja"></i></div>
          <div>
            <div id="profileUsernameDisplay" style="font-weight: bold; font-size: 16px; color: #fff;">yantoyanti700</div>
            <span id="profileUserBadge" style="background: var(--gold-gradient); color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;">TITANIUM VIP SLOT</span>
          </div>
        </div>
      </div>
      <div class="profile-card">
        <div class="card-title">
          <span><i class="fas fa-receipt"></i> Pesanan Saya</span>
          <span style="font-size: 11px; color: #aaa; cursor: pointer;" onclick="filterOrders('Semua')">Lihat Semua &gt;</span>
        </div>
        <div class="grid-menu">
          <button class="grid-btn" onclick="filterOrders('Belum Dibayar')"><i class="fas fa-wallet"></i>Belum Bayar</button>
          <button class="grid-btn" onclick="filterOrders('Dikemas')"><i class="fas fa-box"></i>Dikemas</button>
          <button class="grid-btn" onclick="filterOrders('Dikirim')"><i class="fas fa-truck"></i>Dikirim</button>
          <button class="grid-btn" onclick="filterOrders('Selesai')"><i class="fas fa-star"></i>Selesai</button>
        </div>
        <div id="selectedStatusTitle" style="font-size: 12px; color: var(--slot-gold); margin-top: 15px; font-weight: bold;">Daftar Pesanan:</div>
        <div id="customerOrdersList"></div>
      </div>
    </div>
  </div>

  <!-- MODAL CHECKOUT DARI DRAFT / BELI SEKARANG -->
  <div class="modal" id="checkoutModal">
    <div class="checkout-box animated-pop">
      <h3 style="color: var(--slot-gold); margin-bottom: 12px; font-size: 16px;"><i class="fas fa-credit-card"></i> Form Pembayaran</h3>
      <div id="buyItemTitle" style="font-size: 13px; font-weight: bold; margin-bottom: 12px; color: #fff;"></div>
      <form onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="custName" required placeholder="Masukkan nama kamu">
        </div>
        <div class="form-group">
          <label>Nomor Whatsapp</label>
          <input type="tel" id="custPhone" required placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label>Alamat Lengkap</label>
          <input type="text" id="custAddress" required placeholder="Jl. Contoh No. 123">
        </div>
        <div class="form-group">
          <label>Metode & Status Pembayaran</label>
          <select id="payOption">
            <option value="Belum Dibayar">BAYAR NANTI (Status: Belum Dibayar)</option>
            <option value="Dikemas">BAYAR SEKARANG / LUNAS (Status: Dikemas)</option>
          </select>
        </div>
        <button type="submit" class="btn-buy-direct" style="width:100%; margin-top: 10px; padding: 10px;">Konfirmasi & Beli</button>
        <button type="button" onclick="closeCheckout()" style="background: none; border: none; color: #888; width: 100%; margin-top: 8px; font-size: 12px; cursor: pointer;">Batal</button>
      </form>
    </div>
  </div>

  <!-- MODAL LUNASI PEMBAYARAN -->
  <div class="modal" id="payNowModal">
    <div class="checkout-box animated-pop">
      <h3 style="color: var(--slot-gold); margin-bottom: 12px; font-size: 16px;"><i class="fas fa-wallet"></i> Selesaikan Pembayaran</h3>
      <div id="payOrderInfo" style="font-size: 12px; color: #fff; margin-bottom: 10px;"></div>
      
      <div class="pay-detail-box">
        <label style="font-size: 11px; color:#aaa;">Pilih Metode Pembayaran:</label>
        <select id="payMethodSelect" style="width:100%; padding:8px; margin-top:4px; background:#2a2a2a; color:#fff; border:1px solid #444; border-radius:4px;" onchange="updatePayInstruction()">
          <option value="bca">Transfer BCA (Virtual Account)</option>
          <option value="mandiri">Transfer Mandiri</option>
          <option value="qris">QRIS (Gopay / OVO / Dana / ShopeePay)</option>
        </select>

        <div class="bank-acc-info" id="bankInstruction">
          <div style="font-size:11px; color:#aaa;">Nomor BCA Virtual Account:</div>
          <div style="font-size:16px; font-weight:bold; color:var(--slot-gold); margin:4px 0;">8830 0812 3456 7890</div>
          <div style="font-size:10px; color:#888;">a.n Sopy Online Shop Official</div>
        </div>
      </div>

      <button onclick="confirmPaymentProcess()" class="btn-buy-direct" style="width:100%; margin-top: 10px; padding: 10px; background:var(--gold-gradient); color:#000; font-weight:bold;">
        <i class="fas fa-check-circle"></i> Konfirmasi Sudah Bayar
      </button>
      <button onclick="closePayNowModal()" style="background: none; border: none; color: #888; width: 100%; margin-top: 8px; font-size: 12px; cursor: pointer;">Bayar Nanti</button>
    </div>
  </div>

  <script>
    const productsData = [
      { id: 1, title: "BLOK GREND 55 RACING SET FULL SYSTEM", price: 245000, discount: "-40%", sold: "1,2RB terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80" },
      { id: 2, title: "[READY COD] BAN FDR SOFT COMPOUND MP-27 RACING TIRE", price: 85000, discount: "-50%", sold: "834 terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80" },
      { id: 3, title: "[ORIGINAL] Karburator PE 24 26 28 Racing Edition", price: 87000, discount: "-50%", sold: "2,5RB terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500&q=80" },
      { id: 4, title: "AH1 PISTON CASTING MENTAH DOME SET PIN 13", price: 105000, discount: "-73%", sold: "240 terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500&q=80" },
      { id: 5, title: "Shockbreaker Original DBS G+ SERIES 8899 Shock Belakang", price: 156600, discount: "-30%", sold: "252 terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80" },
      { id: 6, title: "SEPATU SNEAKERS URBAN GOLD RACING EDITION", price: 420000, discount: "-20%", sold: "512 terjual", category: "sepatu", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80" },
      { id: 7, title: "JAM TANGAN MEWAH GOLD CHRONOGRAPH", price: 650000, discount: "-15%", sold: "98 terjual", category: "aksesoris", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80" },
      { id: 8, title: "KNALPOT RACING PRO SLOT EDITION STAINLESS", price: 150000, discount: "-35%", sold: "1,8RB terjual", category: "otomotif", img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80" }
    ];

    let currentUser = localStorage.getItem('sopy_logged_user') || null;

    function initDefaultOrders() {
      const existing = localStorage.getItem('sopy_orders');
      if (!existing) {
        const dummyOrders = [
          { id: 'ORD-577825', productName: 'BLOK GREND 55 RACING SET FULL SYSTEM', totalPrice: 245000, paymentStatus: 'Belum Dibayar', date: '12/08/2026' },
          { id: 'ORD-689392', productName: 'KNALPOT RACING PRO SLOT EDITION', totalPrice: 150000, paymentStatus: 'Belum Dibayar', date: '12/08/2026' }
        ];
        localStorage.setItem('sopy_orders', JSON.stringify(dummyOrders));
      }
    }

    let currentBuyingProduct = null;
    let selectedCategory = 'semua';
    let currentPayOrderId = null;

    /* FUNGSI LOGIN & AUTENTIKASI STATUS */
    function checkAuthUI() {
      const middleNavText = document.getElementById('middleNavText');
      const middleNavIcon = document.getElementById('middleNavIcon');

      if (currentUser) {
        middleNavText.innerText = currentUser;
        middleNavIcon.className = "fas fa-user-check";
      } else {
        middleNavText.innerText = "Login";
        middleNavIcon.className = "fas fa-right-to-bracket";
      }
    }

    function handleMiddleNavClick() {
      if (currentUser) {
        openProfileModal();
      } else {
        openLoginModal();
      }
    }

    function openLoginModal() {
      document.getElementById('loginModal').style.display = 'block';
    }

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    function switchAuthTab(tab) {
      if(tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('formLogin').style.display = 'block';
        document.getElementById('formRegister').style.display = 'none';
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('formRegister').style.display = 'block';
        document.getElementById('formLogin').style.display = 'none';
      }
    }

    function submitLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value;
      currentUser = u;
      localStorage.setItem('sopy_logged_user', u);
      alert('Login berhasil! Selamat datang, ' + u);
      closeLoginModal();
      checkAuthUI();
      openProfileModal(); // Buka profil customer setelah login
    }

    function submitRegister(e) {
      e.preventDefault();
      const u = document.getElementById('regUser').value;
      currentUser = u;
      localStorage.setItem('sopy_logged_user', u);
      alert('Pendaftaran berhasil! Otomatis masuk sebagai ' + u);
      closeLoginModal();
      checkAuthUI();
      openProfileModal(); // Buka profil customer setelah mendaftar
    }

    function processLogout() {
      if (confirm("Apakah Anda yakin ingin keluar dari akun ini?")) {
        currentUser = null;
        localStorage.removeItem('sopy_logged_user');
        closeProfileModal();
        checkAuthUI();
        alert("Anda telah berhasil keluar.");
      }
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGridList');
      if (items.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px 0; font-size:13px;">Barang tidak ditemukan...</div>`;
        return;
      }

      let html = '';
      items.forEach(prod => {
        html += `
          <div class="product-card">
            <div class="img-wrapper" onclick="previewMedia('${prod.img}', '${prod.title}')">
              ${prod.discount ? `<div class="discount-badge">${prod.discount}</div>` : ''}
              <img src="${prod.img}" class="product-img" alt="${prod.title}">
            </div>
            <div class="product-info">
              <div>
                <div class="product-title">${prod.title}</div>
                <div class="product-price">Rp ${prod.price.toLocaleString('id-ID')}</div>
                <div class="product-sold">${prod.sold || ''}</div>
              </div>
              <div class="action-btn-group">
                <button class="btn-cart" onclick="addToCart(${prod.id})">
                  <i class="fas fa-cart-plus"></i> + Keranjang
                </button>
                <button class="btn-buy-direct" onclick="openCheckout('${prod.title}', ${prod.price})">Beli</button>
              </div>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function filterCategory(cat, btnElement) {
      selectedCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');
      searchProducts();
    }

    function searchProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = productsData.filter(p => {
        const matchesCategory = (selectedCategory === 'semua') || (p.category === selectedCategory);
        const matchesKeyword = p.title.toLowerCase().includes(keyword);
        return matchesCategory && matchesKeyword;
      });
      renderProducts(filtered);
    }

    function getCartItems() { return JSON.parse(localStorage.getItem('sopy_cart') || '[]'); }

    function saveCartItems(cart) {
      localStorage.setItem('sopy_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCartItems();
      const totalCount = cart.reduce((acc, curr) => acc + curr.qty, 0);
      document.getElementById('topCartBadge').innerText = totalCount;
    }

    function addToCart(prodId) {
      const prod = productsData.find(p => p.id === prodId);
      if(!prod) return;

      const cart = getCartItems();
      const existing = cart.find(c => c.id === prodId);

      if (existing) { existing.qty += 1; } 
      else { cart.push({ id: prod.id, title: prod.title, price: prod.price, img: prod.img, qty: 1 }); }
      
      saveCartItems(cart);
    }

    function openCartModal() {
      const cart = getCartItems();
      const container = document.getElementById('cartItemsList');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<div style="color:#888; text-align:center; padding: 20px 0; font-size:12px;">Keranjang kamu kosong.</div>`;
        document.getElementById('cartFooter').style.display = 'none';
      } else {
        document.getElementById('cartFooter').style.display = 'block';
        let html = '';
        cart.forEach((item, idx) => {
          total += (item.price * item.qty);
          html += `
            <div class="cart-item">
              <img src="${item.img}" class="cart-item-img" alt="${item.title}">
              <div class="cart-item-info">
                <div class="cart-item-title">${item.title}</div>
                <div class="cart-item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
                <div class="cart-qty-control">
                  <div class="qty-btn" onclick="changeQty(${idx}, -1)">-</div>
                  <span class="qty-number">${item.qty}</span>
                  <div class="qty-btn" onclick="changeQty(${idx}, 1)">+</div>
                </div>
              </div>
              <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#f44336; cursor:pointer; font-size:14px;"><i class="fas fa-trash"></i></button>
            </div>
          `;
        });
        container.innerHTML = html;
        document.getElementById('cartTotalPrice').innerText = 'Rp ' + total.toLocaleString('id-ID');
      }

      document.getElementById('cartModal').style.display = 'block';
    }

    function changeQty(idx, delta) {
      const cart = getCartItems();
      if (!cart[idx]) return;

      cart[idx].qty += delta;

      if (cart[idx].qty <= 0) {
        cart.splice(idx, 1);
      }

      saveCartItems(cart);
      openCartModal();
    }

    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

    function removeFromCart(idx) {
      const cart = getCartItems();
      cart.splice(idx, 1);
      saveCartItems(cart);
      openCartModal();
    }

    function checkoutFromCart() {
      if (!currentUser) {
        closeCartModal();
        alert("Silakan login terlebih dahulu untuk checkout.");
        openLoginModal();
        return;
      }

      const cart = getCartItems();
      if (cart.length === 0) return;
      let total = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
      let titles = cart.map(c => `${c.title} (x${c.qty})`).join(', ');
      closeCartModal();
      openCheckout(titles, total);
    }

    function openCheckout(title, price) {
      // PROTEKSI: Harus Login Terlebih Dahulu
      if (!currentUser) {
        alert("Silakan login terlebih dahulu untuk melakukan pembelian.");
        openLoginModal();
        return;
      }

      currentBuyingProduct = { title, price };
      document.getElementById('buyItemTitle').innerText = title + " - Total: Rp " + price.toLocaleString('id-ID');
      document.getElementById('checkoutModal').style.display = 'block';
    }

    function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

    function submitOrder(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      const payStatus = document.getElementById('payOption').value;

      const orderData = {
        id: 'ORD-' + Math.floor(Math.random() * 899999 + 100000),
        productName: currentBuyingProduct.title,
        totalPrice: currentBuyingProduct.price,
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        paymentStatus: payStatus,
        date: new Date().toLocaleDateString('id-ID')
      };

      const orders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      orders.unshift(orderData);
      localStorage.setItem('sopy_orders', JSON.stringify(orders));

      localStorage.removeItem('sopy_cart');
      updateCartBadge();

      alert('Pesanan berhasil dibuat!');
      closeCheckout();
      openProfileModal();
      filterOrders(payStatus);
    }

    /* BUKA PROFIL / HALAMAN CUSTOMER (DENGAN CEK LOGIN) */
    function openProfileModal() {
      // PROTEKSI: Jika belum login, paksa ke form login
      if (!currentUser) {
        alert("Anda harus login terlebih dahulu untuk mengakses menu profil/pesanan customer.");
        openLoginModal();
        return;
      }

      document.getElementById('profileUsernameDisplay').innerText = currentUser;
      document.getElementById('profileModal').style.display = 'block';
      filterOrders('Belum Dibayar');
    }

    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

    function filterOrders(status) {
      const orders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      const container = document.getElementById('customerOrdersList');
      document.getElementById('selectedStatusTitle').innerText = 'Daftar Pesanan: ' + status;

      let filtered = orders;
      if (status !== 'Semua') {
        filtered = orders.filter(o => o.paymentStatus === status);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="color:#666; font-size:11px; text-align:center; padding: 15px 0;">Tidak ada pesanan dengan status "${status}"</div>`;
        return;
      }

      let html = '';
      filtered.forEach(ord => {
        let badgeBg = '#f44336';
        if (ord.paymentStatus === 'Dikemas') badgeBg = '#ff9800';
        if (ord.paymentStatus === 'Dikirim') badgeBg = '#2196f3';
        if (ord.paymentStatus === 'Selesai') badgeBg = '#4caf50';

        html += `
          <div class="order-item-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:var(--slot-gold); font-weight:bold;">${ord.id}</span>
              <span class="badge-status" style="background:${badgeBg}; color:#fff;">${ord.paymentStatus}</span>
            </div>
            <div style="color:#fff; margin-top:6px; font-weight:bold;">${ord.productName}</div>
            <div style="color:#aaa; margin-top:2px;">Total: Rp ${ord.totalPrice.toLocaleString('id-ID')}</div>
            
            ${ord.paymentStatus === 'Belum Dibayar' ? `
              <div style="display:flex; justify-content:flex-end; margin-top:10px; border-top:1px solid #222; padding-top:8px;">
                <button class="btn-pay-now" onclick="openPayNowModal('${ord.id}', '${ord.productName}', ${ord.totalPrice})">
                  <i class="fas fa-credit-card"></i> Bayar Sekarang
                </button>
              </div>
            ` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function openPayNowModal(orderId, productName, price) {
      currentPayOrderId = orderId;
      document.getElementById('payOrderInfo').innerHTML = `
        <div style="border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 6px;">
          <b>ID Pesanan:</b> <span style="color:var(--slot-gold);">${orderId}</span>
        </div>
        <div><b>Barang:</b> ${productName}</div>
        <div style="margin-top:2px;"><b>Total Pembayaran:</b> <span style="color:var(--slot-gold); font-weight:bold;">Rp ${price.toLocaleString('id-ID')}</span></div>
      `;
      document.getElementById('payNowModal').style.display = 'block';
    }

    function closePayNowModal() {
      document.getElementById('payNowModal').style.display = 'none';
    }

    function updatePayInstruction() {
      const method = document.getElementById('payMethodSelect').value;
      const box = document.getElementById('bankInstruction');

      if (method === 'bca') {
        box.innerHTML = `
          <div style="font-size:11px; color:#aaa;">Nomor BCA Virtual Account:</div>
          <div style="font-size:16px; font-weight:bold; color:var(--slot-gold); margin:4px 0;">8830 0812 3456 7890</div>
          <div style="font-size:10px; color:#888;">a.n Sopy Online Shop Official</div>
        `;
      } else if (method === 'mandiri') {
        box.innerHTML = `
          <div style="font-size:11px; color:#aaa;">Nomor Mandiri Rekening:</div>
          <div style="font-size:16px; font-weight:bold; color:var(--slot-gold); margin:4px 0;">13700 9876 5432 1</div>
          <div style="font-size:10px; color:#888;">a.n Sopy Online Shop Official</div>
        `;
      } else {
        box.innerHTML = `
          <div style="font-size:11px; color:#aaa;">Scan Kode QRIS berikut:</div>
          <div style="text-align:center; padding:8px 0;">
            <i class="fas fa-qrcode" style="font-size:60px; color:#fff;"></i>
          </div>
          <div style="font-size:10px; color:#aaa; text-align:center;">Mendukung All E-Wallet / Mobile Banking</div>
        `;
      }
    }

    function confirmPaymentProcess() {
      let orders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      const index = orders.findIndex(o => o.id === currentPayOrderId);

      if (index !== -1) {
        orders[index].paymentStatus = 'Dikemas';
        localStorage.setItem('sopy_orders', JSON.stringify(orders));
        alert('Pembayaran berhasil dikonfirmasi! Pesanan Anda sekarang dalam status "Dikemas".');
        closePayNowModal();
        filterOrders('Dikemas');
      }
    }

    function previewMedia(url, title) {
      const container = document.getElementById('previewMediaContainer');
      document.getElementById('previewTitle').innerText = title;
      container.innerHTML = `<img src="${url}" class="preview-media-full" alt="Preview">`;
      document.getElementById('imageModal').style.display = 'block';
    }

    function closeMediaPreview() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function switchTab(el) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
    }

    function showBeranda() {
      closeProfileModal();
      closeCartModal();
    }

    // INITIALIZATION
    initDefaultOrders();
    renderProducts(productsData);
    updateCartBadge();
    checkAuthUI();
  </script>
</body>
</html>
