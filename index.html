<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online Shop - Slot Casino Theme</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --slot-gold: #ffd700; 
      --slot-bg: #0a0a0a; 
      --slot-card-bg: #181818;
      --slot-text: #f5f5f5;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f5af19 100%);
      --dark-card: #222222;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--slot-bg); color: var(--slot-text); min-height: 100vh; padding-bottom: 100px; }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #1f1f1f 0%, #111111 100%);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--slot-gold);
    }
    .top-search-row { display: flex; align-items: center; gap: 12px; }
    .search-box {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid var(--slot-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
    }
    .search-box input { border: none; outline: none; width: 100%; font-size: 13px; color: #fff; background: transparent; }
    
    .header-cart-btn {
      position: relative;
      color: var(--slot-gold);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .badge-cart-top {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #ff0000;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* GRID PRODUK DENGAN ANIMASI GAMBAR */
    .container { max-width: 900px; margin: 15px auto; padding: 0 12px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .product-card { 
      background: var(--slot-card-bg); 
      border-radius: 8px; 
      overflow: hidden; 
      border: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: var(--slot-gold);
    }

    .img-wrapper { overflow: hidden; position: relative; cursor: pointer; }
    .product-img { 
      width: 100%; 
      height: 160px; 
      object-fit: cover; 
      background: #222; 
      display: block;
      transition: transform 0.4s ease;
    }
    .img-wrapper:hover .product-img {
      transform: scale(1.1);
    }

    .product-info { padding: 10px; }
    .product-title { font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .product-price { color: var(--slot-gold); font-size: 14px; font-weight: 700; margin-bottom: 10px; }

    /* TOMBOL SEJALAN */
    .action-btn-group { display: flex; gap: 6px; width: 100%; }
    .btn-cart { 
      flex: 1; 
      background: var(--gold-gradient); 
      color: #000; 
      border: none; 
      padding: 8px 4px; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-buy-direct { 
      flex: 1; 
      background: #e50914; 
      color: #fff; 
      border: none; 
      padding: 8px 4px; 
      border-radius: 4px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 11px; 
      text-align: center;
    }

    /* BOTTOM NAV BAR */
    .fixed-bottom-container { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 150; background: #121212; border-top: 1px solid var(--slot-gold); }
    .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 11px; cursor: pointer; width: 33.3%; }
    .nav-item i { font-size: 18px; margin-bottom: 3px; }
    .nav-item.active { color: var(--slot-gold); font-weight: bold; }

    /* MODAL GENERAL & ANIMASI POP-UP */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; overflow-y: auto; }
    
    .animated-pop {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* TAMPILAN KERANJANG MODAL */
    .cart-modal-box {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 450px;
      margin: 50px auto;
      border: 1px solid var(--slot-gold);
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #333;
    }
    .cart-item-title { font-size: 12px; color: #fff; font-weight: bold; }
    .cart-item-price { font-size: 12px; color: var(--slot-gold); }

    /* MODAL PREVIEW GAMBAR */
    .image-preview-box {
      max-width: 450px;
      margin: 60px auto;
      background: #181818;
      border: 2px solid var(--slot-gold);
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      position: relative;
    }
    .preview-img-full {
      width: 100%;
      border-radius: 6px;
      max-height: 350px;
      object-fit: cover;
    }

    /* PROFIL SAYA */
    .profile-container { background: var(--slot-bg); color: var(--slot-text); min-height: 100vh; width: 100%; max-width: 500px; margin: 0 auto; position: relative; border-left: 1px solid #333; border-right: 1px solid #333; }
    .profile-header { background: linear-gradient(135deg, #1c1a00, #3a3200); padding: 20px 15px; color: var(--slot-gold); border-bottom: 2px solid var(--slot-gold); position: relative; }
    .profile-top-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; }
    .profile-user-info { display: flex; align-items: center; gap: 12px; }
    .profile-avatar { width: 50px; height: 50px; border-radius: 50%; background: #111; border: 2px solid var(--slot-gold); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--slot-gold); }
    
    .header-admin-btn {
      background: rgba(0,0,0,0.6);
      color: var(--slot-gold);
      border: 1px solid var(--slot-gold);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .profile-card { background: var(--dark-card); margin: 12px; padding: 14px; border-radius: 8px; border: 1px solid #333; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--slot-gold); border-bottom: 1px solid #333; padding-bottom: 6px; }
    
    .grid-menu { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; font-size: 11px; gap: 8px; color: #ccc; }
    .grid-btn { background: none; border: none; color: #ccc; cursor: pointer; padding: 5px; border-radius: 6px; }
    .grid-btn i { font-size: 20px; color: var(--slot-gold); margin-bottom: 5px; display: block; }

    .close-profile-btn { position: absolute; top: 12px; left: 12px; background: none; border: none; color: var(--slot-gold); font-size: 18px; cursor: pointer; }

    /* CHECKOUT MODAL FORM */
    .checkout-box { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; margin: 60px auto; border: 1px solid var(--slot-gold); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    
    .order-item-card { background: #111; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-top: 8px; font-size: 12px; }
    .badge-status { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="top-search-row">
      <div class="search-box">
        <i class="fas fa-magnifying-glass" style="color:var(--slot-gold);"></i>
        <!-- INPUT SEARCH DIPASANG EVENT ONINPUT UNTUK SEARCH LANGSUNG -->
        <input type="text" id="searchInput" oninput="searchProducts()" placeholder="Cari barang slot pilihanmu...">
      </div>
      <div class="header-cart-btn" onclick="openCartModal()">
        <i class="fas fa-cart-shopping"></i>
        <span class="badge-cart-top" id="topCartBadge">0</span>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="product-grid" id="productGridList">
      <!-- PRODUK DI-GENERATE OTOMATIS OLEH JAVASCRIPT AGAR BISA DI-SEARCH -->
    </div>
  </div>

  <!-- FIXED BOTTOM BAR -->
  <div class="fixed-bottom-container">
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab(this)">
        <i class="fas fa-house"></i>
        <span>Beranda</span>
      </div>

      <div class="nav-item" onclick="switchTab(this)">
        <i class="fas fa-headset"></i>
        <span>Live Chat</span>
      </div>

      <div class="nav-item" onclick="openProfileModal()">
        <i class="far fa-user"></i>
        <span>Saya</span>
      </div>
    </nav>
  </div>

  <!-- MODAL DAFTAR KERANJANG BELANJA -->
  <div class="modal" id="cartModal">
    <div class="cart-modal-box animated-pop">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
        <h3 style="color:var(--slot-gold); font-size:16px;"><i class="fas fa-cart-shopping"></i> Keranjang Belanja Saya</h3>
        <button onclick="closeCartModal()" style="background:none; border:none; color:var(--slot-gold); font-size:20px; cursor:pointer;">&times;</button>
      </div>

      <div id="cartItemsList"></div>

      <div id="cartFooter" style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
        <div style="display:flex; justify-content:space-between; color:#fff; font-size:14px; font-weight:bold; margin-bottom:10px;">
          <span>Total:</span>
          <span id="cartTotalPrice" style="color:var(--slot-gold);">Rp 0</span>
        </div>
        <button class="btn-buy-direct" style="width:100%; padding:10px;" onclick="checkoutFromCart()">Checkout Keranjang</button>
      </div>
    </div>
  </div>

  <!-- MODAL PREVIEW GAMBAR -->
  <div class="modal" id="imageModal">
    <div class="image-preview-box animated-pop">
      <button onclick="closeImagePreview()" style="position:absolute; top:8px; right:12px; background:none; border:none; color:var(--slot-gold); font-size:22px; cursor:pointer;">&times;</button>
      <h4 id="previewTitle" style="color:var(--slot-gold); font-size:13px; margin-bottom:10px;"></h4>
      <img id="previewImgSrc" class="preview-img-full" src="" alt="Preview">
      <button class="btn-buy-direct" style="width:100%; margin-top:12px; padding:10px;" onclick="closeImagePreview()">Tutup Preview</button>
    </div>
  </div>

  <!-- MODAL PROFIL SAYA -->
  <div class="modal" id="profileModal">
    <div class="profile-container animated-pop">
      <div class="profile-header">
        <button class="close-profile-btn" onclick="closeProfileModal()"><i class="fas fa-arrow-left"></i></button>
        
        <div class="profile-top-bar">
          <a href="admin.html" class="header-admin-btn">
            <i class="fas fa-user-shield"></i> Admin VIP
          </a>
        </div>

        <div class="profile-user-info">
          <div class="profile-avatar">
            <i class="fas fa-user-ninja"></i>
          </div>
          <div>
            <div style="font-weight: bold; font-size: 16px; color: #fff;">yantoyanti700</div>
            <span style="background: var(--gold-gradient); color: #000; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold;">TITANIUM VIP SLOT</span>
          </div>
        </div>
      </div>

      <div class="profile-card">
        <div class="card-title">
          <span><i class="fas fa-receipt"></i> Pesanan Saya</span>
          <span style="font-size: 11px; color: #aaa; cursor: pointer;" onclick="filterOrders('Semua')">Lihat Semua &gt;</span>
        </div>
        
        <div class="grid-menu">
          <button class="grid-btn" onclick="filterOrders('Belum Dibayar')">
            <i class="fas fa-wallet"></i>Belum Bayar
          </button>
          <button class="grid-btn" onclick="filterOrders('Dikemas')">
            <i class="fas fa-box"></i>Dikemas
          </button>
          <button class="grid-btn" onclick="filterOrders('Dikirim')">
            <i class="fas fa-truck"></i>Dikirim
          </button>
          <button class="grid-btn" onclick="filterOrders('Selesai')">
            <i class="fas fa-star"></i>Selesai
          </button>
        </div>

        <div id="selectedStatusTitle" style="font-size: 12px; color: var(--slot-gold); margin-top: 15px; font-weight: bold;">
          Daftar Pesanan:
        </div>

        <div id="customerOrdersList"></div>
      </div>

    </div>
  </div>

  <!-- MODAL CHECKOUT -->
  <div class="modal" id="checkoutModal">
    <div class="checkout-box animated-pop">
      <h3 style="color: var(--slot-gold); margin-bottom: 12px; font-size: 16px;"><i class="fas fa-credit-card"></i> Form Pembayaran</h3>
      <div id="buyItemTitle" style="font-size: 13px; font-weight: bold; margin-bottom: 12px; color: #fff;"></div>
      
      <form onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="custName" required placeholder="Masukkan nama kamu">
        </div>
        <div class="form-group">
          <label>Nomor Whatsapp</label>
          <input type="tel" id="custPhone" required placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
          <label>Alamat Lengkap</label>
          <input type="text" id="custAddress" required placeholder="Jl. Contoh No. 123">
        </div>
        <div class="form-group">
          <label>Metode & Status Pembayaran</label>
          <select id="payOption">
            <option value="Belum Dibayar">BAYAR NANTI (Status: Belum Dibayar)</option>
            <option value="Dikemas">BAYAR SEKARANG / LUNAS (Status: Dikemas)</option>
          </select>
        </div>
        <button type="submit" class="btn-buy-direct" style="width:100%; margin-top: 10px; padding: 10px;">Konfirmasi & Beli</button>
        <button type="button" onclick="closeCheckout()" style="background: none; border: none; color: #888; width: 100%; margin-top: 8px; font-size: 12px; cursor: pointer;">Batal</button>
      </form>
    </div>
  </div>

  <script>
    // DATABASE PRODUK
    const productsData = [
      {
        id: 1,
        title: "KNALPOT RACING PRO SLOT EDITION",
        price: 150000,
        img: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500&q=80",
        fullImg: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=800&q=80"
      },
      {
        id: 2,
        title: "HELM FULL FACE BLACK GOLD EDITION",
        price: 350000,
        img: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=500&q=80",
        fullImg: "https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=800&q=80"
      }
    ];

    let currentBuyingProduct = null;

    // FUNGSI TAMPILKAN PRODUK (WITH SEARCH FILTER)
    function renderProducts(items) {
      const grid = document.getElementById('productGridList');
      if (items.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#888; padding:30px 0; font-size:13px;">Barang yang dicari tidak ditemukan...</div>`;
        return;
      }

      let html = '';
      items.forEach(prod => {
        html += `
          <div class="product-card">
            <div class="img-wrapper" onclick="previewImage('${prod.fullImg}', '${prod.title}')">
              <img src="${prod.img}" class="product-img" alt="${prod.title}">
            </div>
            <div class="product-info">
              <div class="product-title">${prod.title}</div>
              <div class="product-price">Rp ${prod.price.toLocaleString('id-ID')}</div>
              
              <div class="action-btn-group">
                <button class="btn-cart" onclick="addToCart('${prod.title}', ${prod.price})">
                  <i class="fas fa-cart-plus"></i> + Keranjang
                </button>
                <button class="btn-buy-direct" onclick="openCheckout('${prod.title}', ${prod.price})">
                  Beli
                </button>
              </div>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    // FUNGSI SEARCH SENSOR OTOMATIS
    function searchProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = productsData.filter(p => p.title.toLowerCase().includes(keyword));
      renderProducts(filtered);
    }

    // KERANJANG SEMENTARA
    function getCartItems() {
      return JSON.parse(localStorage.getItem('sopy_cart') || '[]');
    }

    function saveCartItems(cart) {
      localStorage.setItem('sopy_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const cart = getCartItems();
      document.getElementById('topCartBadge').innerText = cart.length;
    }

    function addToCart(title, price) {
      const cart = getCartItems();
      cart.push({ title, price });
      saveCartItems(cart);
      alert('Barang berhasil disimpan di Keranjang!');
    }

    function openCartModal() {
      const cart = getCartItems();
      const container = document.getElementById('cartItemsList');
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = `<div style="color:#888; text-align:center; padding: 20px 0; font-size:12px;">Keranjang kamu masih kosong.</div>`;
        document.getElementById('cartFooter').style.display = 'none';
      } else {
        document.getElementById('cartFooter').style.display = 'block';
        let html = '';
        cart.forEach((item, idx) => {
          total += item.price;
          html += `
            <div class="cart-item">
              <div>
                <div class="cart-item-title">${item.title}</div>
                <div class="cart-item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
              </div>
              <button onclick="removeFromCart(${idx})" style="background:none; border:none; color:#f44336; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>
          `;
        });
        container.innerHTML = html;
        document.getElementById('cartTotalPrice').innerText = 'Rp ' + total.toLocaleString('id-ID');
      }

      document.getElementById('cartModal').style.display = 'block';
    }

    function closeCartModal() {
      document.getElementById('cartModal').style.display = 'none';
    }

    function removeFromCart(idx) {
      const cart = getCartItems();
      cart.splice(idx, 1);
      saveCartItems(cart);
      openCartModal();
    }

    function checkoutFromCart() {
      const cart = getCartItems();
      if (cart.length === 0) return;
      
      let total = cart.reduce((acc, curr) => acc + curr.price, 0);
      let titles = cart.map(c => c.title).join(', ');

      closeCartModal();
      openCheckout(titles, total);
    }

    // PREVIEW GAMBAR
    function previewImage(url, title) {
      document.getElementById('previewImgSrc').src = url;
      document.getElementById('previewTitle').innerText = title;
      document.getElementById('imageModal').style.display = 'block';
    }

    function closeImagePreview() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function openCheckout(title, price) {
      currentBuyingProduct = { title, price };
      document.getElementById('buyItemTitle').innerText = title + " - Total: Rp " + price.toLocaleString('id-ID');
      document.getElementById('checkoutModal').style.display = 'block';
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function submitOrder(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;
      const payStatus = document.getElementById('payOption').value;

      const orderData = {
        id: 'ORD-' + Math.floor(Math.random() * 899999 + 100000),
        productName: currentBuyingProduct.title,
        totalPrice: currentBuyingProduct.price,
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        paymentStatus: payStatus,
        date: new Date().toLocaleDateString('id-ID')
      };

      const orders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      orders.unshift(orderData);
      localStorage.setItem('sopy_orders', JSON.stringify(orders));

      localStorage.removeItem('sopy_cart');
      updateCartBadge();

      alert('Pesanan berhasil dibuat!');
      closeCheckout();
      openProfileModal();
      filterOrders(payStatus);
    }

    function openProfileModal() {
      document.getElementById('profileModal').style.display = 'block';
      filterOrders('Semua');
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function filterOrders(status) {
      const orders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      const container = document.getElementById('customerOrdersList');
      document.getElementById('selectedStatusTitle').innerText = 'Daftar Pesanan: ' + status;

      let filtered = orders;
      if (status !== 'Semua') {
        filtered = orders.filter(o => o.paymentStatus === status);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div style="color:#666; font-size:11px; text-align:center; padding: 15px 0;">Tidak ada pesanan dengan status "${status}"</div>`;
        return;
      }

      let html = '';
      filtered.forEach(ord => {
        let color = '#f44336';
        if (ord.paymentStatus === 'Dikemas') color = '#ff9800';
        if (ord.paymentStatus === 'Dikirim') color = '#2196f3';
        if (ord.paymentStatus === 'Selesai') color = '#4caf50';

        html += `
          <div class="order-item-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="color:var(--slot-gold); font-weight:bold;">${ord.id}</span>
              <span class="badge-status" style="background:${color}; color:#fff;">${ord.paymentStatus}</span>
            </div>
            <div style="color:#fff; margin-top:6px;"><b>${ord.productName}</b></div>
            <div style="color:#aaa; margin-top:2px;">Total: Rp ${ord.totalPrice.toLocaleString('id-ID')}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function switchTab(el) {
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      el.classList.add('active');
    }

    // INIT INITIAL LOAD
    renderProducts(productsData);
    updateCartBadge();
  </script>
</body>
</html>
