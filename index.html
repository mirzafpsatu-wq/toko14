<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sopy Online - Toko Customer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { 
      --shopee-orange: #ee4d2d; 
      --shopee-dark-orange: #d73211;
      --shopee-bg: #f5f5f5; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--shopee-bg); color: #333; min-height: 100vh; padding-bottom: 80px; }

    header {
      background: var(--shopee-orange); color: white; padding: 12px 20px;
      position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .brand { font-size: 18px; font-weight: 700; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .cart-btn { background: white; color: var(--shopee-orange); border: none; padding: 7px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .admin-btn { 
      background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.5); 
      padding: 7px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; text-decoration: none; 
      display: flex; align-items: center; gap: 6px; font-size: 12px; transition: background 0.2s;
    }
    .admin-btn:hover { background: rgba(255, 255, 255, 0.35); }

    .container { max-width: 900px; margin: 20px auto; padding: 0 12px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .product-card { 
      background: white; border-radius: 8px; overflow: hidden; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; 
      justify-content: space-between; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
    .product-img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
    .product-info { padding: 10px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .product-title { font-size: 13px; font-weight: 600; line-height: 1.3; height: 34px; overflow: hidden; color: #222; margin-bottom: 4px; }
    .product-price { color: var(--shopee-orange); font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    
    .btn-buy { background: var(--shopee-orange); color: white; border: none; width: 100%; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-buy:active { opacity: 0.8; }
    .btn-secondary { background: #fff; color: var(--shopee-orange); border: 1px solid var(--shopee-orange); width: 100%; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: white; border-radius: 10px; width: 100%; max-width: 450px; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .close-modal { position: absolute; top: 12px; right: 15px; font-size: 22px; cursor: pointer; color: #888; font-weight: bold; }

    .detail-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #eee; }
    .detail-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 6px; }
    .detail-price { font-size: 18px; font-weight: 700; color: var(--shopee-orange); margin-bottom: 12px; }
    .detail-desc-title { font-size: 12px; font-weight: 700; color: #666; margin-bottom: 4px; text-transform: uppercase; }
    .detail-desc { font-size: 13px; color: #444; line-height: 1.5; background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 16px; white-space: pre-line; }

    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 12px; }

    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px; z-index: 2000; transition: all 0.3s ease; opacity: 0; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand"><i class="fas fa-store"></i> Sopy Online Shop</a>
    
    <div class="nav-actions">
      <button class="cart-btn" onclick="openCartModal()">
        <i class="fas fa-shopping-cart"></i> Keranjang (<span id="cartCount">0</span>)
      </button>
      <a href="admin.html" class="admin-btn">
        <i class="fas fa-user-shield"></i> Login Admin
      </a>
    </div>
  </header>

  <div class="container">
    <h3 style="margin-bottom: 12px; font-size: 16px; color: #444;"><i class="fas fa-bag-shopping"></i> Produk Pilihan</h3>
    <div class="product-grid" id="productGrid">
      <!-- Produk di-render otomatis via JS -->
    </div>
  </div>

  <!-- MODAL DETAIL PRODUK -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeDetailModal()">&times;</span>
      <img id="detailImg" src="" class="detail-img" alt="Detail Produk">
      <div id="detailTitle" class="detail-title"></div>
      <div id="detailPrice" class="detail-price"></div>
      <div class="detail-desc-title">Deskripsi Produk:</div>
      <div id="detailDesc" class="detail-desc"></div>
      
      <div class="modal-actions">
        <button id="btnAddToCartModal" class="btn-secondary">
          <i class="fas fa-cart-plus"></i> + Keranjang
        </button>
        <button id="btnBuyNowModal" class="btn-buy">
          <i class="fas fa-bolt"></i> Beli Sekarang
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL KERANJANG & CHECKOUT -->
  <div class="modal" id="checkoutModal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeCartModal()">&times;</span>
      <h3 style="margin-bottom: 15px; color: var(--shopee-orange); font-size: 16px;"><i class="fas fa-cart-shopping"></i> Checkout Pesanan</h3>
      
      <div id="cartItemsList"></div>
      
      <div style="display: flex; justify-content: space-between; font-weight: bold; margin: 15px 0; font-size: 14px;">
        <span>Total Bayar:</span>
        <span style="color: var(--shopee-orange);" id="modalTotalPrice">Rp 0</span>
      </div>

      <hr style="margin-bottom: 15px; border: 0; border-top: 1px dashed #ccc;">

      <form onsubmit="handleCheckoutSubmit(event)">
        <div class="form-group">
          <label>Nama Lengkap*</label>
          <input type="text" id="custName" placeholder="Contoh: Budi Santoso" required>
        </div>
        <div class="form-group">
          <label>Nomor Telepon / HP*</label>
          <input type="tel" id="custPhone" placeholder="Contoh: 081234567890" required>
        </div>
        <div class="form-group">
          <label>Alamat Lengkap Pengiriman*</label>
          <textarea id="custAddress" rows="2" placeholder="Nama jalan, RT/RW, Kecamatan, Kota" required></textarea>
        </div>
        <button type="submit" class="btn-buy" style="padding: 12px; font-size: 14px; margin-top: 5px;">
          <i class="fas fa-check-circle"></i> Selesaikan Pesanan
        </button>
      </form>
    </div>
  </div>

  <div id="toast">Notifikasi</div>

  <script>
    let cart = [];

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const products = JSON.parse(localStorage.getItem('sopy_products') || '[]');

      if (products.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">Belum ada produk yang dijual admin.</div>`;
        return;
      }

      let html = '';
      products.forEach((p) => {
        html += `
          <div class="product-card" onclick="openProductDetail(${p.id})">
            <img src="${p.image}" class="product-img" alt="${p.title}">
            <div class="product-info">
              <div>
                <div class="product-title">${p.title}</div>
                <div class="product-price">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
              </div>
              <button class="btn-buy" onclick="event.stopPropagation(); addToCart(${p.id})"><i class="fas fa-plus"></i> Beli</button>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function openProductDetail(productId) {
      const products = JSON.parse(localStorage.getItem('sopy_products') || '[]');
      const target = products.find(p => p.id === productId);
      if (!target) return;

      document.getElementById('detailImg').src = target.image;
      document.getElementById('detailTitle').innerText = target.title;
      document.getElementById('detailPrice').innerText = 'Rp ' + Number(target.price).toLocaleString('id-ID');
      document.getElementById('detailDesc').innerText = target.desc || 'Tidak ada deskripsi produk.';

      document.getElementById('btnAddToCartModal').onclick = function() {
        addToCart(target.id);
        closeDetailModal();
      };

      document.getElementById('btnBuyNowModal').onclick = function() {
        addToCart(target.id);
        closeDetailModal();
        openCartModal();
      };

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function addToCart(productId) {
      const products = JSON.parse(localStorage.getItem('sopy_products') || '[]');
      const target = products.find(p => p.id === productId);
      if (!target) return;

      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...target, qty: 1 });
      }

      updateCartBadge();
      showToast("Produk ditambah ke keranjang!");
    }

    function updateCartBadge() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').innerText = totalQty;
    }

    function openCartModal() {
      if (cart.length === 0) {
        alert("Keranjang belanjaan Anda masih kosong!");
        return;
      }

      const listContainer = document.getElementById('cartItemsList');
      let html = '';
      let total = 0;

      cart.forEach((item, index) => {
        const itemSubtotal = item.price * item.qty;
        total += itemSubtotal;
        html += `
          <div class="cart-item">
            <div>
              <b>${item.title}</b><br>
              <span style="color:#666;">Rp ${Number(item.price).toLocaleString('id-ID')} x ${item.qty}</span>
            </div>
            <div>
              <b style="color:var(--shopee-orange);">Rp ${itemSubtotal.toLocaleString('id-ID')}</b>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; margin-left:8px; cursor:pointer;"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
      document.getElementById('modalTotalPrice').innerText = 'Rp ' + total.toLocaleString('id-ID');
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartBadge();
      if (cart.length === 0) {
        closeCartModal();
      } else {
        openCartModal();
      }
    }

    function closeCartModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function handleCheckoutSubmit(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const newOrder = {
        id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
        date: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
        customerName: name,
        customerPhone: phone,
        customerAddress: address,
        items: cart,
        totalPrice: grandTotal
      };

      const currentOrders = JSON.parse(localStorage.getItem('sopy_orders') || '[]');
      currentOrders.unshift(newOrder);
      localStorage.setItem('sopy_orders', JSON.stringify(currentOrders));

      alert("Terima kasih! Pesanan Anda berhasil dibuat dan dikirim ke Admin.");

      cart = [];
      updateCartBadge();
      closeCartModal();
      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custAddress').value = '';
    }

    window.addEventListener('storage', function(e) {
      if (e.key === 'sopy_products') {
        renderProducts();
      }
    });

    renderProducts();
  </script>
</body>
</html>
